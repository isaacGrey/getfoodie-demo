name: Demo checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
      - name: Exercise role and ordering workflows
        run: node --test tests/*.test.cjs
      - name: Validate Vercel config and entrypoint
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('vercel.json','utf8'));if(v.version!==2)process.exit(1);const h=fs.readFileSync('index.html','utf8');for(const src of ['/core.js','/app.js','/styles.css','/v2.css'])if(!h.includes(src))process.exit(1);"
